<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Prime Voice Hack</title>
  <script src="libs/qrcode.min.js"></script>
  <style>
    body {
      width: 360px;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      color: #0f0;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 0;
      border-bottom: 1px solid #30363d;
      padding-bottom: 10px;
    }

    .section-title {
      font-size: 12px;
      color: #8b949e;
      text-transform: uppercase;
      margin-top: 15px;
      margin-bottom: 5px;
      border-bottom: 1px solid #30363d;
    }

    select {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      background-color: #000;
      color: #0f0;
      border: 1px solid #30363d;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      cursor: pointer;
      background-color: #238636;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #2ea043;
    }

    button.running {
      background-color: #da3633;
    }

    button.running:hover {
      background-color: #f85149;
    }
    
    /* Przyciski specyficzne */
    #downloadPiperBtn { background-color: #8957e5; }
    #downloadPiperBtn:hover { background-color: #9e6cf5; }
    #connectRemoteBtn { background-color: #1f6feb; }
    #connectRemoteBtn:hover { background-color: #388bfd; }

    #statusLog {
      margin-top: 10px;
      font-size: 12px;
      color: #8b949e;
      background: #161b22;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #30363d;
      min-height: 40px;
    }

    #statusLog.active {
      color: #0f0;
      border-color: #0f0;
    }

    /* Sekcja Zdalna */
    #remoteSection {
      margin-top: 20px;
      text-align: center;
      background: #161b22;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #30363d;
    }

    #qrCode {
      display: flex;
      justify-content: center;
      margin: 10px 0;
      background: #fff; /* QR musi być na białym dla kontrastu */
      padding: 5px;
      border-radius: 4px;
      width: 128px;
      margin-left: auto;
      margin-right: auto;
    }
    
    #remoteStatus {
        font-size: 11px;
        color: #8b949e;
    }

    .hidden {
        display: none !important;
    }
    
    .tabs {
        display: flex;
        justify-content: space-around;
        margin-bottom: 10px;
    }
    
    .tab {
        cursor: pointer;
        padding: 5px 10px;
        border-bottom: 2px solid transparent;
        font-size: 13px;
    }
    
    .tab.active {
        border-bottom: 2px solid #0f0;
        color: #fff;
    }
  </style>
</head>
<body>
  <h1>Prime Voice Reader <span style="font-size:10px; opacity:0.5">v3.2</span></h1>

  <div class="tabs">
      <div class="tab active" data-target="localPanel">Lokalny</div>
      <div class="tab" data-target="remotePanel">Zdalny</div>
  </div>

  <!-- PANEL LOKALNY -->
  <div id="localPanel">
      <label for="voiceSelect" class="section-title">Wybierz Głos Systemowy:</label>
      <select id="voiceSelect">
        <option value="" disabled selected>Ładowanie głosów...</option>
      </select>
      
      <div style="font-size:11px; margin-bottom:15px; color:#8b949e; text-align:right;">
          <a href="https://chromewebstore.google.com/detail/piper-text-to-speech-voic/ppnfahcipommelgaapjalhooaeeblmeg" target="_blank" style="color:#58a6ff; text-decoration:none;">
              + Zainstaluj głosy AI (Piper)
          </a>
      </div>

      <button id="toggleBtn">Uruchom Lektora</button>
      <div id="statusLog">Gotowy do działania</div>
  </div>

  <!-- PANEL ZDALNY -->
  <div id="remotePanel" class="hidden">
      <div style="font-size: 12px; margin-bottom: 10px; color: #aaa;">
          Użyj telefonu jako głośnika (lepsze głosy Google/Samsung).
      </div>
      
      <button id="connectRemoteBtn">Generuj Kod Połączenia</button>
      
      <div id="remoteSection" class="hidden">
          <div id="qrCode"></div>
          <div id="remoteStatus">Zeskanuj telefonem, aby połączyć...</div>
          <div style="margin-top:5px; font-size:10px; word-break:break-all;" id="directLink"></div>
      </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
